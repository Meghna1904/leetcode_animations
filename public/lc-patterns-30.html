<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LC Pattern Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --card: #141414;
  --border: #1f1f1f;
  --border2: #2a2a2a;
  --text: #e2e2e2;
  --muted: #555;
  --muted2: #777;
  --accent: #e8ff5a;
  --accent2: #5affda;
  --easy: #4ade80;
  --medium: #fb923c;
  --hard: #f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh}

/* ---- HEADER ---- */
header {
  padding: 40px 32px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}
.logo {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
h1 {
  font-size: clamp(22px, 4vw, 36px);
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1;
}
h1 span { color: var(--accent); }
.stats {
  display: flex;
  gap: 20px;
  align-items: center;
}
.stat {
  text-align: center;
  font-family: 'Space Mono', monospace;
}
.stat-n { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
.stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

/* ---- CONTROLS ---- */
.controls {
  padding: 16px 32px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 7px 10px 7px 32px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--muted); }
.si { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.fbtn {
  padding: 6px 13px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--muted2);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
}
.fbtn:hover, .fbtn.on { background: var(--border2); border-color: var(--accent); color: var(--accent); }
.cinfo { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-left: auto; }

/* ---- GRID ---- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1px;
  background: var(--border);
  padding: 1px;
  margin: 16px;
}
.card {
  background: var(--card);
  overflow: hidden;
  transition: background 0.15s;
}
.card.hide { display: none; }

/* Card Header */
.ch {
  padding: 14px 16px 10px;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.cn {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  min-width: 22px;
  padding-top: 3px;
}
.ch-main { flex: 1 }
.ct {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 4px;
}
.ctrig {
  font-size: 11px;
  color: var(--muted2);
  font-family: 'Space Mono', monospace;
  line-height: 1.4;
}
.ch-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  min-width: 40px;
}
.pc {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  background: rgba(232,255,90,0.07);
  border: 1px solid rgba(232,255,90,0.18);
  padding: 2px 6px;
  border-radius: 2px;
}
.arr { font-size: 10px; color: var(--muted); transition: transform 0.2s; font-family: 'Space Mono', monospace; }
.card.open .arr { transform: rotate(180deg); }

/* Invariant bar */
.inv-bar {
  padding: 6px 16px;
  background: rgba(90,255,218,0.04);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--accent2);
  display: none;
  line-height: 1.5;
}
.card.open .inv-bar { display: block; }

/* Problem list */
.plist { display: none; }
.card.open .plist { display: block; }
.prow {
  display: grid;
  grid-template-columns: 18px 1fr 52px;
  gap: 8px;
  align-items: center;
  padding: 7px 16px;
  border-top: 1px solid var(--border);
  transition: background 0.1s;
}
.prow:hover { background: rgba(255,255,255,0.03); }
.prow.hide { display: none; }
.pi { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted); }
.pname {
  font-size: 12px;
  color: var(--muted2);
  text-decoration: none;
  transition: color 0.15s;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pname:hover { color: var(--accent); }
.diff {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 2px;
  text-align: center;
  font-weight: 700;
}
.E { color: var(--easy); background: rgba(74,222,128,0.08); }
.M { color: var(--medium); background: rgba(251,146,60,0.08); }
.H { color: var(--hard); background: rgba(248,113,113,0.08); }

/* empty state */
.empty { padding: 60px; text-align: center; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 12px; grid-column: 1/-1; background: var(--card); }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">// lc_patterns.sheet</div>
    <h1>51 <span>Patterns</span> You Need</h1>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-n">51</div><div class="stat-l">Patterns</div></div>
    <div class="stat"><div class="stat-n" id="tcount">330</div><div class="stat-l">Problems</div></div>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <span class="si">⌕</span>
    <input type="text" id="sq" placeholder="search pattern / problem..." oninput="filterAll()">
  </div>
  <button class="fbtn on" onclick="fDiff('all',this)">All</button>
  <button class="fbtn" onclick="fDiff('E',this)">Easy</button>
  <button class="fbtn" onclick="fDiff('M',this)">Medium</button>
  <button class="fbtn" onclick="fDiff('H',this)">Hard</button>
  <button class="fbtn" onclick="expandAll()">Expand All</button>
  <button class="fbtn" onclick="collapseAll()">Collapse</button>
  <span class="cinfo" id="cinfo"></span>
</div>

<div class="grid" id="grid"></div>

let activeDiff = 'all';

function build() {
  const grid = document.getElementById('grid');
  P.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'c' + idx;
    card.innerHTML = `
      <div class="ch" onclick="toggle(${idx})">
        <span class="cn">${String(idx+1).padStart(2,'0')}</span>
        <div class="ch-main">
          <div class="ct">${p.name}</div>
          <div class="ctrig">${p.trig}</div>
        </div>
        <div class="ch-right">
          <span class="pc">${p.problems.length}</span>
          <span class="arr">▼</span>
        </div>
      </div>
      <div class="inv-bar">${p.inv}</div>
      <div class="plist">
        ${p.problems.map((pr,i) => `
          <div class="prow" data-diff="${pr.d}">
            <span class="pi">${i+1}</span>
            <a class="pname" href="${pr.url}" target="_blank">${pr.name}</a>
            <span class="diff ${pr.d}">${pr.d==='E'?'Easy':pr.d==='M'?'Med':'Hard'}</span>
          </div>
        `).join('')}
      </div>
    `;
    grid.appendChild(card);
  });
  updateInfo();
}

function toggle(idx) {
  document.getElementById('c'+idx).classList.toggle('open');
}

function expandAll() {
  document.querySelectorAll('.card:not(.hide)').forEach(c => c.classList.add('open'));
}
function collapseAll() {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
}

function fDiff(d, btn) {
  activeDiff = d;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  filterAll();
}

function filterAll() {
  const q = document.getElementById('sq').value.toLowerCase();
  P.forEach((p, idx) => {
    const card = document.getElementById('c'+idx);
    const nameMatch = p.name.toLowerCase().includes(q) || p.trig.toLowerCase().includes(q);
    let anyProb = false;
    card.querySelectorAll('.prow').forEach(row => {
      const d = row.dataset.diff;
      const txt = row.textContent.toLowerCase();
      const dm = activeDiff === 'all' || d === activeDiff;
      const tm = !q || txt.includes(q) || nameMatch;
      if (dm && tm) { row.classList.remove('hide'); anyProb = true; }
      else row.classList.add('hide');
    });
    card.classList.toggle('hide', !anyProb && !nameMatch && q !== '');
    if (!anyProb && q) card.classList.remove('open');
  });
  updateInfo();
}

function updateInfo() {
  const vis = document.querySelectorAll('.card:not(.hide)').length;
  const probs = document.querySelectorAll('.prow:not(.hide)').length;
  document.getElementById('cinfo').textContent = `${vis} patterns · ${probs} problems`;
  document.getElementById('tcount').textContent = document.querySelectorAll('.prow').length;
}

build();
</script>
